<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Introly</title>
<meta name="description" content="Type a number, tap send — WhatsApp opens with your intro already written.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --paper:       #FBF8F3;
    --card:        #FFFFFF;
    --edge:        #F0EAE0;
    --ink:         #1B2A4A;
    --ink-soft:    #56658A;
    --rule:        #DED6C8;
    --marigold:    #DE9412;
    --marigold-dp: #B57509;
    --on-marigold: #24180A;
    --flag:        #C4562F;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --paper:       #12192A;
      --card:        #1A2338;
      --edge:        #212C45;
      --ink:         #EFEDE7;
      --ink-soft:    #9AA6C2;
      --rule:        #2E3A56;
      --marigold:    #E5A63A;
      --marigold-dp: #F0B855;
      --on-marigold: #1A1206;
      --flag:        #E8835C;
    }
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper:       #12192A;
    --card:        #1A2338;
    --edge:        #212C45;
    --ink:         #EFEDE7;
    --ink-soft:    #9AA6C2;
    --rule:        #2E3A56;
    --marigold:    #E5A63A;
    --marigold-dp: #F0B855;
    --on-marigold: #1A1206;
    --flag:        #E8835C;
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Newsreader", Georgia, serif;
    font-size: 18px;
    line-height: 1.6;
    display: flex;
    justify-content: center;
    padding-block: 26px 44px;
    padding-inline: 18px;
  }

  .wrap { width: 100%; max-width: 440px; }

  :focus-visible {
    outline: 3px solid var(--marigold);
    outline-offset: 2px;
    border-radius: 3px;
  }

  /* ---------- header ---------- */

  header { margin-bottom: 22px; }

  .mark {
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    font-weight: 600;
    font-size: 1.05rem;
    letter-spacing: -0.005em;
    margin: 0;
    display: inline-block;
    padding-bottom: 5px;
    border-bottom: 3px solid var(--marigold);
  }

  header h1 {
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    font-optical-sizing: auto;
    font-weight: 600;
    font-size: clamp(1.5rem, 6vw, 1.85rem);
    line-height: 1.16;
    letter-spacing: -0.018em;
    margin: 18px 0 10px;
    text-wrap: balance;
  }

  header p {
    margin: 0;
    color: var(--ink-soft);
    font-size: 1rem;
    line-height: 1.5;
    max-width: 38ch;
  }

  /* ---------- panels ---------- */

  .panel {
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 18px;
    padding: 22px;
    margin-bottom: 16px;
  }

  label {
    display: block;
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    font-weight: 500;
    font-size: 0.8rem;
    letter-spacing: 0.02em;
    color: var(--ink-soft);
    margin-bottom: 7px;
  }

  input, textarea {
    background: var(--edge);
    border: 1px solid var(--rule);
    color: var(--ink);
    border-radius: 10px;
    padding: 12px 13px;
    font-family: "Newsreader", Georgia, serif;
    font-size: 1rem;
    width: 100%;
  }
  textarea {
    resize: vertical;
    min-height: 122px;
    line-height: 1.5;
  }
  ::placeholder { color: var(--ink-soft); opacity: 0.75; }

  .field { margin-bottom: 16px; }
  .field:last-of-type { margin-bottom: 0; }

  .hint {
    font-size: 0.82rem;
    line-height: 1.45;
    color: var(--ink-soft);
    margin: 8px 2px 0;
  }

  .token {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 0.88em;
    background: var(--edge);
    border: 1px solid var(--rule);
    border-radius: 5px;
    padding: 1px 5px;
  }

  .reset-line {
    display: flex;
    justify-content: flex-end;
    margin-top: 8px;
  }
  .link-btn {
    background: none;
    border: none;
    color: var(--ink-soft);
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    font-size: 0.82rem;
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
    padding: 4px 0;
  }
  .link-btn:hover { color: var(--ink); }

  .phone-row {
    display: flex;
    gap: 8px;
  }
  .phone-row .code {
    width: 68px;
    flex: 0 0 68px;
    text-align: center;
  }
  .phone-row .num { flex: 1; min-width: 0; }

  /* ---------- actions ---------- */

  .send {
    width: 100%;
    background: var(--marigold);
    color: var(--on-marigold);
    border: none;
    border-radius: 12px;
    padding: 16px 20px;
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    font-weight: 600;
    font-size: 1.04rem;
    letter-spacing: -0.005em;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    margin-top: 20px;
    transition: background 0.15s ease;
  }
  .send:hover { background: var(--marigold-dp); }
  .send svg { width: 19px; height: 19px; flex: none; }

  .secondary {
    width: 100%;
    background: transparent;
    border: 1px solid var(--rule);
    color: var(--ink);
    border-radius: 12px;
    padding: 13px 18px;
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    font-weight: 500;
    font-size: 0.95rem;
    cursor: pointer;
    margin-top: 9px;
    transition: border-color 0.15s ease;
  }
  .secondary:hover { border-color: var(--ink-soft); }

  .error {
    font-size: 0.86rem;
    color: var(--flag);
    margin: 10px 2px 0;
    min-height: 1.3em;
  }

  /* ---------- list ---------- */

  .list-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 4px;
  }

  .list-head h2 {
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    font-weight: 600;
    font-size: 0.86rem;
    letter-spacing: 0.02em;
    color: var(--ink-soft);
    margin: 0;
  }

  .count {
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    font-size: 0.86rem;
    font-weight: 600;
    color: var(--marigold-dp);
    font-variant-numeric: tabular-nums;
  }

  .empty {
    font-size: 0.94rem;
    color: var(--ink-soft);
    padding: 10px 0 2px;
  }

  .entry {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding: 11px 0;
    border-top: 1px solid var(--rule);
  }

  .entry .who {
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    font-weight: 600;
    font-size: 0.98rem;
    letter-spacing: -0.008em;
    overflow-wrap: anywhere;
  }
  .entry .who span {
    display: block;
    font-weight: 500;
    font-size: 0.84rem;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }

  .entry .when {
    flex: none;
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    font-size: 0.8rem;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }

  .list-foot {
    display: flex;
    gap: 9px;
    margin-top: 16px;
  }
  .list-foot .secondary { margin-top: 0; }

  @media (prefers-reduced-motion: reduce) {
    .send, .secondary { transition: none; }
  }

  @media (max-width: 380px) {
    .panel { padding: 18px; }
  }
</style>
</head>
<body>

<div class="wrap">

  <header>
    <p class="mark">Introly</p>
    <h1>Send it before they've said goodbye.</h1>
    <p>Type their name and number, tap send — WhatsApp opens with your intro already written.</p>
  </header>

  <div class="panel">

    <div class="field">
      <label for="message">Your message</label>
      <textarea id="message" spellcheck="true"></textarea>
      <p class="hint"><span class="token">{greeting}</span> becomes “Hi Rajesh” when you enter a name below, and just “Hello” when you don’t. Use <span class="token">{name}</span> on its own for the bare name.</p>
      <div class="reset-line">
        <button type="button" class="link-btn" id="resetBtn">Reset to default</button>
      </div>
    </div>

    <div class="field">
      <label for="name">Their name <span style="text-transform:none">(optional)</span></label>
      <input type="text" id="name" placeholder="Rajesh" autocomplete="off" autocapitalize="words">
    </div>

    <div class="field">
      <label for="phone">Their WhatsApp number</label>
      <div class="phone-row">
        <input type="text" id="countryCode" class="code" value="+91" inputmode="tel" aria-label="Country code">
        <input type="tel" id="phone" class="num" placeholder="98765 43210" inputmode="numeric" aria-label="Phone number">
      </div>
    </div>

    <button class="send" id="sendBtn" type="button">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2C6.5 2 2 6.5 2 12c0 1.8.5 3.5 1.4 5L2 22l5.2-1.4c1.4.8 3.1 1.2 4.8 1.2 5.5 0 10-4.5 10-10S17.5 2 12 2zm0 18.2c-1.6 0-3.1-.4-4.4-1.2l-.3-.2-3.1.8.8-3-.2-.3C4 14.9 3.6 13.5 3.6 12c0-4.6 3.8-8.4 8.4-8.4s8.4 3.8 8.4 8.4-3.8 8.2-8.4 8.2z"/><path d="M17.5 14.4c-.3-.1-1.7-.9-2-1-.3-.1-.5-.1-.7.1-.2.3-.8 1-.9 1.1-.2.2-.3.2-.6.1-.3-.2-1.2-.5-2.3-1.5-.9-.8-1.4-1.7-1.6-2-.2-.3 0-.5.1-.6.1-.1.3-.3.4-.5.1-.1.2-.3.3-.4.1-.2 0-.4 0-.5C10.1 9 9.6 7.8 9.4 7.3c-.2-.5-.4-.4-.5-.4h-.5c-.2 0-.5.1-.7.3-.2.3-1 1-1 2.3 0 1.4 1 2.7 1.1 2.9.1.2 2 3.1 4.9 4.3.7.3 1.2.5 1.6.6.7.2 1.3.2 1.8.1.5-.1 1.7-.7 1.9-1.4.2-.6.2-1.2.2-1.3-.1-.1-.3-.2-.6-.4z"/></svg>
      Open in WhatsApp
    </button>

    <button class="secondary" id="copyMsgBtn" type="button">Copy the message instead</button>

    <p class="error" id="errorMsg"></p>

  </div>

  <div class="panel">
    <div class="list-head">
      <h2>Messaged</h2>
      <span class="count" id="count"></span>
    </div>
    <div id="listBody"></div>
    <div class="list-foot" id="listFoot" hidden>
      <button class="secondary" id="copyListBtn" type="button">Copy all</button>
      <button class="secondary" id="clearListBtn" type="button">Clear</button>
    </div>
  </div>

</div>

<script>
/* ════════════════════════════════════════════════════════
   Your default message.
   {greeting} → "Hi Rajesh" with a name, "Hello" without.
   {name}     → the bare name, empty if you left it blank.
   ════════════════════════════════════════════════════════ */
const DEFAULT_MESSAGE =
  "{greeting}! Great meeting you today. I'm Nitesh Kyal — I help businesses go digital " +
  "and fix the things slowing them down: websites, apps, and simple systems for enquiries " +
  "and orders.\n\n" +
  "My details are here if you'd like to keep them:\n" +
  "https://kyalit.github.io/card\n\n" +
  "Would be good to stay in touch.";
/* ════════════════════════════════════════════════════════ */

const messageEl = document.getElementById("message");
const nameEl    = document.getElementById("name");
const codeEl    = document.getElementById("countryCode");
const phoneEl   = document.getElementById("phone");
const errorEl   = document.getElementById("errorMsg");
const listBody  = document.getElementById("listBody");
const listFoot  = document.getElementById("listFoot");
const countEl   = document.getElementById("count");

/* ---- storage, which may be unavailable ---- */

function get(key) {
  try { return localStorage.getItem(key); } catch (e) { return null; }
}
function set(key, value) {
  try { localStorage.setItem(key, value); } catch (e) { /* no storage, carry on */ }
}

/* ---- message ---- */

const savedMessage = get("introly_message");
messageEl.value = (savedMessage !== null && savedMessage !== "") ? savedMessage : DEFAULT_MESSAGE;
messageEl.addEventListener("input", function () { set("introly_message", messageEl.value); });

document.getElementById("resetBtn").addEventListener("click", function () {
  messageEl.value = DEFAULT_MESSAGE;
  set("introly_message", DEFAULT_MESSAGE);
});

const savedCode = get("introly_code");
if (savedCode) codeEl.value = savedCode;
codeEl.addEventListener("input", function () { set("introly_code", codeEl.value); });

function resolvedMessage() {
  const who = nameEl.value.trim();
  return messageEl.value
    .replace(/\{greeting\}/g, who ? "Hi " + who : "Hello")
    .replace(/\{name\}/g, who);
}

/* ---- the list ---- */

function loadList() {
  let rows = [];
  try { rows = JSON.parse(get("introly_sent") || "[]"); } catch (e) { rows = []; }
  return Array.isArray(rows) ? rows : [];
}

function saveList(rows) {
  set("introly_sent", JSON.stringify(rows.slice(0, 60)));
}

function stamp(iso) {
  const then = new Date(iso);
  if (isNaN(then)) return "";
  const now = new Date();
  const sameDay = then.toDateString() === now.toDateString();
  return sameDay
    ? then.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
    : then.toLocaleDateString([], { day: "numeric", month: "short" });
}

function renderList() {
  const rows = loadList();
  listBody.textContent = "";

  if (rows.length === 0) {
    countEl.textContent = "";
    listFoot.hidden = true;
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "Nobody yet. Go and meet someone.";
    listBody.appendChild(p);
    return;
  }

  countEl.textContent = rows.length;
  listFoot.hidden = false;

  rows.forEach(function (row) {
    const entry = document.createElement("div");
    entry.className = "entry";

    const who = document.createElement("div");
    who.className = "who";
    who.textContent = row.name || row.number;
    if (row.name) {
      const num = document.createElement("span");
      num.textContent = row.number;
      who.appendChild(num);
    }

    const when = document.createElement("div");
    when.className = "when";
    when.textContent = stamp(row.at);

    entry.appendChild(who);
    entry.appendChild(when);
    listBody.appendChild(entry);
  });
}

/* ---- sending ---- */

function buildNumber() {
  const digits = phoneEl.value.replace(/\D/g, "");
  const code   = codeEl.value.replace(/\D/g, "");

  if (digits.length < 7) {
    errorEl.textContent = "That number looks too short. Check it and try again.";
    return null;
  }
  if (!code) {
    errorEl.textContent = "Add a country code, like +91.";
    return null;
  }
  return { code: code, digits: digits, full: code + digits };
}

function record(num) {
  const rows = loadList();
  rows.unshift({
    name: nameEl.value.trim(),
    number: "+" + num.code + " " + num.digits,
    at: new Date().toISOString()
  });
  saveList(rows);
  renderList();
  nameEl.value = "";
  phoneEl.value = "";
}

document.getElementById("sendBtn").addEventListener("click", function () {
  errorEl.textContent = "";
  const num = buildNumber();
  if (!num) return;

  window.open("https://wa.me/" + num.full + "?text=" + encodeURIComponent(resolvedMessage()), "_blank");
  record(num);
});

phoneEl.addEventListener("keydown", function (e) {
  if (e.key === "Enter") document.getElementById("sendBtn").click();
});

/* ---- copying ---- */

function copy(text, btn, label) {
  const original = btn.textContent;
  function done() {
    btn.textContent = label;
    setTimeout(function () { btn.textContent = original; }, 1600);
  }
  try {
    navigator.clipboard.writeText(text).then(done, function () { manualCopy(text, done); });
  } catch (e) {
    manualCopy(text, done);
  }
}

function manualCopy(text, done) {
  const box = document.createElement("textarea");
  box.value = text;
  box.setAttribute("readonly", "");
  box.style.position = "fixed";
  box.style.opacity = "0";
  document.body.appendChild(box);
  box.select();
  try { document.execCommand("copy"); done(); } catch (e) { /* nothing more to try */ }
  document.body.removeChild(box);
}

document.getElementById("copyMsgBtn").addEventListener("click", function (e) {
  errorEl.textContent = "";
  copy(resolvedMessage(), e.currentTarget, "Copied");
});

document.getElementById("copyListBtn").addEventListener("click", function (e) {
  const rows = loadList();
  const text = rows.map(function (row) {
    return [row.name || "(no name)", row.number, stamp(row.at)].join(", ");
  }).join("\n");
  copy(text, e.currentTarget, "Copied");
});

document.getElementById("clearListBtn").addEventListener("click", function (e) {
  const btn = e.currentTarget;
  if (btn.dataset.armed === "yes") {
    saveList([]);
    renderList();
    return;
  }
  btn.dataset.armed = "yes";
  btn.textContent = "Tap again to clear";
  setTimeout(function () {
    delete btn.dataset.armed;
    btn.textContent = "Clear";
  }, 3000);
});

renderList();
</script>

</body>
</html>
